schema_version: rolling-split-autotuning/manifest-v1
lifecycle: PREREGISTERED
claim: estimation-only
logical_tables:
  - yellow
  - green
  - for-hire
  - high-volume-for-hire
  - fre-crt-stacr-dnhq
window_months: 12
window_step_months: 1
treatments:
  enabled:
    first_window_fallback_mib: 128
    history_source: enabled-prior-windows-only
    history_limit: 12
    weighted_median_half_life_windows: 3
    target_decoded_batch_bytes: 1073741824
    rounding_mib: 16
    minimum_mib: 64
    maximum_mib: 1024
  fixed:
    - 128
    - 1024
runtime:
  spark: "3.5.5"
  master: "local[8]"
  aqe: false
  shuffle_manager: SortShuffleManager
  shuffle_partitions: 32
  concurrent_gpu_tasks: 2
  dynamic_concurrency: false
  rapids_batch_bytes: 1073741824
  reader_batch_bytes: 2147483648
  scratch_root: /data/tmp
decision_inputs:
  allowed:
    - supplied schemas and projection
    - pushed predicate
    - selected paths and listed encoded lengths
    - Spark and RAPIDS configuration
    - prior successful enabled observations from the same table
  forbidden:
    - parquet footers opened for tuning
    - catalog column statistics
    - row sampling before the decision
    - current or future control outcomes
    - future enabled outcomes
statistics:
  block: rolling window
  order: randomized within block
  repetitions_per_treatment_per_block: 1
  bootstrap: 12-window moving-block, 5000 resamples, 95 percent percentile interval
  thresholds:
    decoded_byte_median_ape: 0.20
    decoded_byte_p90_ape: 0.35
    decoded_row_median_ape: 0.20
    decoded_row_p90_ape: 0.35
    performance_median_regret: 0.10
    performance_p90_regret: 0.25
safety:
  require_cross_treatment_result_match: true
  cpu_reference_windows: first-middle-last
  retry_spill_allowed: false
  scratch_must_be_under: /data/tmp
