evidence_state: measured_instrumentation_smoke
hypothesis: >-
  With concurrentGpuTasks=2 in both modes, dynamic estimation will increase the
  observed successful-task stage-0 admission maximum above two, while the static
  control remains observed at two.
objective:
  primary_metric: maximum gpuMaxConcurrentGpuTasks accumulator value among successful stage-0 task attempts
  estimand_and_experimental_unit: observed maximum per application; one application per mode
  aggregation: maximum over successful stage-0 task attempts; failed attempts reported separately
  confidence_level_and_interval_method: none; single-run instrumentation validation
  minimum_effect: dynamic > 2 and static == 2
  sample_size_power_or_precision_rule: not applicable to this non-performance smoke test
  stopping_and_missing_failed_outlier_policy: both applications must succeed; no exclusions
safety:
  abort_conditions:
    - full canonical result hashes differ
    - executor loss, failed task attempt, or fatal OOM
    - missing event log, admission accumulator, or required GPU plan node
authority:
  environment_and_actions: user-authorized local GPU execution and repository versioning
  max_gpu_hours_runtime_dollars: maximum 0.2 GPU-hours and 10 minutes; no external spend
  credential_reference_or_mechanism_never_secret_value: none
  sensitive_data_and_log_redaction: synthetic range data; no credentials
  cleanup_obligations: committed raw logs were reviewed for secrets before versioning
  git_branch_and_commit: docs/dynamic-gpu-tuning-process; signed follow-up commit
