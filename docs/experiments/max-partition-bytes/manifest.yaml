limitations:
  - one file, one row group, one query, one GPU, local warm-cache storage
  - seven exploratory blocks are not powered confirmatory noninferiority evidence
  - four unadjusted candidate comparisons
  - file partitions and GPU batches remain distinct distributions
  - no evidence here identifies a parallelism knee for multi-row-group data
next_experiment: >-
  Use multiple files with at least 8-16 independently useful, uneven row groups,
  retain the journaled protocol, add a hold-out projection/selectivity, and use
  an independently versioned confirmatory design if a performance claim is desired.
