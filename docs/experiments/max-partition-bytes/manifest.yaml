experiment_id: max-partition-bytes-nyc-tlc-2020-01
run_id: 20260703T131700Z
evidence_state: measured_exploratory
protocol_provenance:
  status: retrospectively_versioned_exploratory_protocol
  statement: >-
    The final manifest and protocol were versioned after execution. No immutable
    pre-run manifest commit or timestamped external registration exists, so this
    is not claimed as an auditable preregistration.
  development_drafts: >-
    Earlier mutable working drafts and two harness-development failures were not
    preserved as evidence. They are non-auditable development notes and support
    no result claim.
split_verdict:
  empty_task_mechanism: SUPPORTED
  performance_effect: EXPLORATORY_INCONCLUSIVE
  bounded_observation: >-
    No candidate showed an observed median scan-stage improvement of at least 5%
    versus 128 MiB across seven randomized complete blocks.
  inference_limit: >-
    Reported paired bootstrap intervals are exploratory, unadjusted for four
    comparisons, and are not confirmatory noninferiority or equivalence bounds.
hypothesis:
  mechanism: >-
    For this one-row-group Parquet file, lowering maxPartitionBytes below the
    row-group span creates additional byte-range tasks but no additional useful
    scan tasks.
  exploratory_performance: >-
    The added empty tasks may affect scan-stage makespan, but direction and
    magnitude are estimated exploratorily.
objective:
  primary_metric: scan-stage makespan in milliseconds from event-log stage timestamps
  experimental_unit: one query execution within one randomized complete block
  aggregation: median by candidate plus paired within-block exploratory differences
  practical_threshold: 5% observed median scan-stage improvement
  uncertainty: >-
    Unadjusted exploratory 95% paired bootstrap intervals; four candidate
    comparisons; no confirmatory coverage claim.
safety_and_acceptance:
  required:
    - canonical GPU aggregate hash equals the separately generated CPU payload hash
    - GPU scan appears in every warm-up and measured physical plan
    - exact seeded allocation and all seven blocks are complete
    - every Task End Reason in every relevant CPU and GPU stage is Success
    - all journal and plan hashes reconcile
  abort:
    - external timeout
    - result mismatch
    - CPU fallback
    - missing or multiple event logs
    - failed, killed, missing, or extra task end
    - executor loss or fatal OOM
authority:
  environment_and_actions: user-authorized local GPU execution and working-tree versioning
  runtime_budget: 20 minutes GPU phase, 5 minutes CPU phase, no external spend
  credentials: none
  data_policy: public dataset; exact repository-root file remains ignored and untracked
  commit_status: no staging or commit by sub-agent
baseline:
  spark.sql.files.maxPartitionBytes: 128m
  spark.sql.files.openCostInBytes: 1
  spark.sql.files.minPartitionNum: 1
  spark.sql.files.maxPartitionNum: unset
  spark.rapids.sql.concurrentGpuTasks: 2
  spark.rapids.sql.concurrentGpuTasks.dynamic: false
treatments:
  only_change: spark.sql.files.maxPartitionBytes
  values_mib: [8, 16, 32, 64, 128]
